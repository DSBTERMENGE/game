<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Visualização gráfica e análise de resultados da Mega-Sena.">
    <title>Game Analysis</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navegacao.css">
  </head>
  <body>
    <header class="barra-navegacao">
      <a class="marca marca--compacta" href="/" aria-label="Game Analysis">GA</a>
      <button id="botao-voltar" class="navegacao-voltar" type="button" disabled>← Voltar</button>
      <a class="navegacao-link" href="/" aria-current="page">Painel</a>
      <details class="navegacao-menu">
        <summary>Cadastros</summary>
        <nav aria-label="Cadastros">
          <a href="/cadastros.html">Visão geral</a>
          <a href="/grupos-padroes.html">Grupos de padrões</a>
          <a href="/padroes.html">Padrões</a>
        </nav>
      </details>
      <strong class="navegacao-pagina">Painel</strong>
    </header>

    <main class="area-trabalho">
      <section class="comandos" aria-labelledby="titulo-comandos">
        <h2 id="titulo-comandos">Comandos</h2>

        <div class="grupo-comandos">
          <input id="arquivo-excel" type="file" accept=".xlsx" hidden>
          <button id="botao-selecionar-excel" type="button">Selecionar Excel</button>
          <button id="botao-importar-excel" type="button" disabled>
            Importar, calcular e armazenar
          </button>
          <span id="nome-arquivo" class="texto-apoio">Nenhum arquivo selecionado</span>
        </div>

        <div class="grupo-comandos">
          <label for="seletor-resultado">Resultado</label>
          <select id="seletor-resultado" disabled>
            <option value="">Nenhum resultado carregado</option>
          </select>
          <button id="botao-anterior" type="button" disabled>Anterior</button>
          <button id="botao-proximo" type="button" disabled>Próximo</button>
        </div>

        <div class="grupo-comandos">
          <label for="tempo-voo">Tempo por resultado</label>
          <input id="tempo-voo" type="number" min="0.1" max="30" step="0.1" value="0.5">
          <span>s</span>
          <button id="botao-voo" type="button" disabled>Iniciar voo dos pássaros</button>
          <button id="botao-mancha" type="button" disabled>Desenhar mancha</button>
          <button id="botao-aparencia" type="button">Aparência</button>
          <button id="botao-limpar" type="button">Limpar gráfico</button>
        </div>

        <p id="mensagem-sistema" class="mensagem-sistema" role="status" aria-live="polite">
          Aguardando dados.
        </p>
      </section>

      <section class="painel" aria-labelledby="titulo-jogo">
        <div class="cabecalho-resultado">
          <h2 id="titulo-jogo">Resultado Nº: <span id="jogo-numero">—</span></h2>
          <output id="coordenada-media">Média espacial: —</output>
          <output id="resumo-geometrico">Geometria: —</output>
        </div>

        <div class="mapa-scroll">
          <div class="mapa" id="mapa-dezenas">
            <svg
              class="mapa__marcas"
              id="camada-marcas"
              aria-hidden="true"
              preserveAspectRatio="none"
            ></svg>
            <div class="mapa__grade" id="grade-dezenas" aria-label="Dezenas de 01 a 60"></div>
          </div>
        </div>

      </section>
    </main>

    <dialog id="dialogo-aparencia" class="dialogo-aparencia">
      <form id="form-aparencia">
        <header>
          <h2>Configuração visual</h2>
          <button id="botao-fechar-aparencia" type="button" aria-label="Fechar">×</button>
        </header>
        <fieldset class="aparencia-cores">
          <legend>Cores</legend>
          <label>Linha <input id="cor-linha" type="color"></label>
          <label>Fechamento <input id="cor-fechamento" type="color"></label>
          <label>Vértices <input id="cor-vertices" type="color"></label>
          <label>Resultado <input id="cor-resultado" type="color"></label>
          <label>Média <input id="cor-media" type="color"></label>
          <label>Centro de gravidade <input id="cor-centro-gravidade" type="color"></label>
          <label>Regiões <input id="cor-regioes" type="color"></label>
        </fieldset>
        <fieldset class="aparencia-medidas">
          <legend>Medidas</legend>
          <label>Espessura (mm) <input id="espessura-linhas" type="number" min="0.1" max="3" step="0.1"></label>
          <label>Diâmetro dos vértices (mm) <input id="diametro-vertices" type="number" min="1" max="10" step="0.5"></label>
          <label>Transparência das regiões <input id="opacidade-regioes" type="number" min="0" max="1" step="0.01"></label>
        </fieldset>
        <fieldset class="aparencia-visibilidade">
          <legend>Elementos visíveis</legend>
          <label><input id="mostrar-linha" type="checkbox"> Linha</label>
          <label><input id="mostrar-fechamento" type="checkbox"> Fechamento</label>
          <label><input id="mostrar-vertices" type="checkbox"> Vértices</label>
          <label><input id="mostrar-resultado" type="checkbox"> Resultado</label>
          <label><input id="mostrar-media" type="checkbox"> Média</label>
          <label><input id="mostrar-centro-gravidade" type="checkbox"> Centro de gravidade</label>
          <label><input id="mostrar-regioes" type="checkbox"> Regiões</label>
        </fieldset>
        <footer>
          <button id="botao-restaurar-aparencia" type="button">Restaurar padrão</button>
          <button type="submit">Salvar</button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/navegacao.js"></script>
  </body>
</html>
