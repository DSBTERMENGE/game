[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msen"
version = "0.1.0"
description = "Aplicação para análise e apoio ao estudo de resultados da Mega-Sena."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1,<1",
    "Flask[dotenv]>=3.1.3,<4",
    "openpyxl>=3.1.5,<4",
    "psycopg[binary]>=3.3.6,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "shapely>=2.1,<3"]

[project.scripts]
msen = "msen.main:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
